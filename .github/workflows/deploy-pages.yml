name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Configure GitHub Pages environment
        id: pages
        uses: actions/configure-pages@v5

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Next.js static export
        env:
          OUTPUT_EXPORT: 'true'
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || vars.NEXT_PUBLIC_API_URL || 'https://mybiotwin.runasp.net' }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path || '/digital-bio' }}
        run: |
          npm run build
          cat << 'EOF' > out/404.html
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>Redirecting...</title>
              <script>
                (function() {
                  var path = window.location.pathname;
                  var search = window.location.search;
                  var hash = window.location.hash;
                  var base = "${{ steps.pages.outputs.base_path || '/digital-bio' }}".replace(/\/$/, "");

                  var cvMatch = path.match(/\/cv-builder\/([a-zA-Z0-9_-]+)\/?$/);
                  if (cvMatch && cvMatch[1] && cvMatch[1] !== "preview") {
                    window.location.replace(base + "/cv-builder/?id=" + cvMatch[1]);
                    return;
                  }

                  window.location.replace(base + "/" + search + hash);
                })();
              </script>
            </head>
            <body>
              <p>Redirecting to CV Builder...</p>
            </body>
          </html>
          EOF

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
